---
name: Build Sivablue ISOs
"on":
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag of the bootc image to build from'
        type: string
        default: stable
      upload_r2:
        description: 'Upload ISOs to Cloudflare R2'
        type: boolean
        default: true
  schedule:
    - cron: '0 2 1 * *'  # 2am UTC on the 1st of every month
  pull_request:
    paths:
      - ".github/workflows/build-iso.yml"
      - "iso_files/live/**"

# CI builds and ships only the *live* ISOs (base + nvidia), into a single R2
# bucket. The autoinstaller flow is preserved as a local convenience via
# hack/non-live-iso-build.sh but is not built or uploaded in CI.
#
# Required GitHub secrets:
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET

jobs:
  build-live:
    name: Live ISO (${{ matrix.flavor }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        flavor: [base, nvidia]

    steps:
      # This is optional, but if you see that your builds are way too big for the runners, you can enable this by uncommenting the following lines:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@517622d6452028f266b7ba4cc9a123b5f58a6b53 # v7
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve refs
        id: ref
        env:
          FLAVOR: ${{ matrix.flavor }}
          IMAGE_TAG: ${{ inputs.image_tag || 'stable' }}
        run: |
          set -eoux pipefail
          case "$FLAVOR" in
            base)   image_name="sivablue";        iso_label="Sivablue-Live" ;;
            nvidia) image_name="sivablue-nvidia"; iso_label="Sivablue-Nvidia-Live" ;;
          esac
          {
            echo "image_ref=ghcr.io/sir-mudkip/${image_name}"
            echo "image_tag=${IMAGE_TAG}"
            echo "iso_basename=${image_name}-${IMAGE_TAG}-x86_64"
            echo "iso_label=${iso_label}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The new Titanoboa contract takes only image-ref and embeds ALL customization in the
      # image, so we bake the live/installer environment into a derived image first. Built with
      # `sudo podman` so it lands in root's store, where Titanoboa's `--mount type=image` reads it.
      - name: Build derived live image
        id: live
        env:
          IMAGE_REF: ${{ steps.ref.outputs.image_ref }}
          IMAGE_TAG: ${{ steps.ref.outputs.image_tag }}
          ISO_LABEL: ${{ steps.ref.outputs.iso_label }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -eoux pipefail
          live_image="localhost/sivablue-live-${FLAVOR}:${IMAGE_TAG}"
          sudo podman build \
            --cap-add sys_admin --security-opt label=disable --squash \
            --build-arg BASE_IMAGE="${IMAGE_REF}:${IMAGE_TAG}" \
            --build-arg IMAGE_REF="${IMAGE_REF}" \
            --build-arg IMAGE_TAG="${IMAGE_TAG}" \
            --build-arg ISO_LABEL="${ISO_LABEL}" \
            --build-arg FLAVOR="${FLAVOR}" \
            -t "${live_image}" \
            "${GITHUB_WORKSPACE}/iso_files/live"
          echo "live_image=${live_image}" >> "$GITHUB_OUTPUT"

      - name: Build live ISO (Titanoboa)
        id: build
        uses: ublue-os/titanoboa@main
        with:
          image-ref: ${{ steps.live.outputs.live_image }}

      - name: Rename + checksum
        id: rename
        env:
          OUTPUT_PATH: ${{ steps.build.outputs.iso-dest }}
          ISO_BASENAME: ${{ steps.ref.outputs.iso_basename }}
        run: |
          set -eoux pipefail
          mkdir -p output
          OUTPUT_DIR="$(realpath output)"
          mv "$OUTPUT_PATH" "$OUTPUT_DIR/${ISO_BASENAME}.iso"
          (cd "$OUTPUT_DIR" && sha256sum "${ISO_BASENAME}.iso" | tee "${ISO_BASENAME}.iso-CHECKSUM")
          echo "output_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload job artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.ref.outputs.iso_basename }}-live
          if-no-files-found: error
          path: ${{ steps.rename.outputs.output_dir }}

      - name: Install rclone
        if: github.event_name != 'pull_request' && (inputs.upload_r2 || github.event_name == 'schedule')
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Upload to Cloudflare R2
        if: github.event_name != 'pull_request' && (inputs.upload_r2 || github.event_name == 'schedule')
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_REGION: auto
          BUCKET: ${{ secrets.R2_BUCKET }}
          SOURCE_DIR: ${{ steps.rename.outputs.output_dir }}
        run: rclone copy --log-level INFO --checksum "$SOURCE_DIR" "R2:$BUCKET"
